name: Go CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.20.x"]
    permissions:
      contents: read

    env:
      # This 2018 course repository predates Go modules and uses GOPATH imports.
      GO111MODULE: off
      GOPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          # There is no go.mod/go.sum in this GOPATH-mode repository.
          cache: false
      - name: Run unit tests
        run: |
          go test ./src/labgob ./src/labrpc ./src/mapreduce
          go test -run '^TestInitialElection2A$' ./src/raft
